name: Deploy to Production

on:
  push:
    branches:
      - test-deploy

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create .env file (BOM-less)
        shell: powershell
        run: |
          # Using ASCII encoding prevents the \ufeff (BOM) and \xff\xfe (UTF-16) errors
          "DATABASE_URL=${{ secrets.DATABASE_URL }}" | Out-File -FilePath .env -Encoding ASCII
      
      - name: Deploy with Docker Compose
        run: docker compose -f docker-compose.prod.yml up -d --build
      
      - name: Clean up old images
        run: docker image prune -f
